# Vérifie les données des certifications sur chaque branche et chaque pull request.
name: Valider les certifications

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate.mjs
